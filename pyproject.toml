[project]
name = "codex-auth-manager"
version = "0.1.0"
description = "Manage multiple Codex CLI OAuth auth.json accounts safely"
readme = "README.md"
authors = [
    { name = "dakixr", email = "dakixr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "websockets>=14,<16",
]

[project.urls]
Repository = "https://github.com/dakixr/codex-auth-manager"

[project.scripts]
cxauth = "codex_auth_manager.cli:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
